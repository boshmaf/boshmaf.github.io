---
layout: default
---
<header class="page-head">
  <div class="wrap">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    {%- if page.updated %}<p class="mono muted">Last updated {{ page.updated | date: "%b %-d, %Y" }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body{% if page.prose %} prose{% endif %}">
{{ content }}
</div>
