<a class="skip" href="#main">Skip to content</a>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="mark" aria-hidden="true">YB</span>{{ site.author.name }}</a>
    <nav aria-label="Main">
      <ul>
        {%- for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
        <li><a href="{{ site.author.cv | relative_url }}">CV</a></li>
      </ul>
    </nav>
    <button class="icon-btn search-btn" type="button" id="open-search" aria-label="Search the site" data-index="{{ '/search.json' | relative_url }}" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="label">Search</span> <kbd>/</kbd>
    </button>
    <button class="icon-btn" type="button" id="theme-toggle" aria-label="Switch to dark theme" hidden>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
