<dialog class="palette" id="palette" aria-label="Search">
  <input id="palette-q" type="search" placeholder="Search papers, news, pages…" autocomplete="off" aria-label="Search query" aria-controls="palette-results">
  <ul id="palette-results" role="listbox" aria-label="Results"></ul>
  <div class="hint mono">↑ ↓ to move · Enter to open · Esc to close</div>
</dialog>
